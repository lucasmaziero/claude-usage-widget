name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One guard for the whole run: a tag that disagrees with pyproject.toml must
  # stop before three builds have burned ten minutes each.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version"
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.read.outputs.version }}" ]; then
            echo "tag v$tag does not match pyproject.toml ${{ steps.read.outputs.version }}" >&2
            exit 1
          fi

  windows:
    needs: guard
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # The icon is vector and the font-dependent tests skip themselves, so Qt
      # never needs a desktop session here.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v7; @v10 is nothing.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

      - name: Ensure Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - run: .\installer\build.ps1

      - name: Checksum
        run: |
          $setup = Get-ChildItem build\AgentGauge-*.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File "$($setup.FullName).sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            build/AgentGauge-*.exe
            build/AgentGauge-*.exe.sha256
          if-no-files-found: error

  macos:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        # PySide6 has no universal2 wheel, so one bundle per architecture is the
        # only honest option.
        #
        # Pin real image names, never a retired one. A label GitHub no longer
        # offers is not rejected: the job sits queued forever, and because
        # `publish` needs this matrix, the whole release hangs with four green
        # jobs and no error to read. That is exactly how macos-13 blocked
        # v1.1.0 after it was retired.
        include:
          - runner: macos-latest        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel      # Intel; macos-13 was retired
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run pytest

      # CODESIGN_ID is unset, so build.sh signs ad-hoc. That is what makes the
      # arm64 binary runnable at all; it is not a Developer ID, and Gatekeeper
      # still warns. Set the secret and this starts signing for real.
      - name: Build
        env:
          CODESIGN_ID: ${{ secrets.MACOS_CODESIGN_ID }}
        run: ./installer/build.sh

      - name: Checksum
        run: |
          cd build
          for f in AgentGauge-*.dmg; do
            shasum -a 256 "$f" | tee "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.arch }}
          path: |
            build/AgentGauge-*.dmg
            build/AgentGauge-*.dmg.sha256
          if-no-files-found: error

  linux:
    needs: guard
    # Deliberately not ubuntu-latest: an AppImage inherits the glibc of the
    # machine that built it, so building on the oldest supported image is what
    # makes it run on anything newer.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

      - run: ./installer/build.sh

      - name: Checksum
        run: |
          cd build
          for f in AgentGauge-*.AppImage; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: |
            build/AgentGauge-*.AppImage
            build/AgentGauge-*.AppImage.sha256
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - run: ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
