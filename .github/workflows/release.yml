name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # The icon is vector and the font-dependent tests skip themselves, so Qt
      # never needs a desktop session here.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v7; @v10 is nothing.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) {
            throw "tag v$tag does not match pyproject.toml version $version"
          }

      - run: uv run ruff check .

      - run: uv run pytest

      - name: Ensure Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - run: .\installer\build.ps1

      - name: Checksum
        run: |
          $setup = Get-ChildItem build\ClaudeUsage-Setup-*.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File "$($setup.FullName).sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsage-Setup
          path: |
            build/ClaudeUsage-Setup-*.exe
            build/ClaudeUsage-Setup-*.exe.sha256
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/ClaudeUsage-Setup-*.exe
            build/ClaudeUsage-Setup-*.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
