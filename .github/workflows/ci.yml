name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # winreg, the tray and the DPI handling are Win32: nothing to test elsewhere.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v7; @v10 is nothing.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff check .

      # Run logs need a token to read; annotations do not. Failing summaries go
      # into one so a red build can be diagnosed from the commit page.
      - name: Test
        shell: pwsh
        run: |
          $out = uv run pytest --tb=short 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`n" | Select-Object -Last 30) -join '%0A')
            Write-Host "::error title=pytest::$tail"
            exit 1
          }
