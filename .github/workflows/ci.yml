name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # winreg, the tray and the DPI handling are Win32: nothing to test elsewhere.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v7; @v10 is nothing.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run pytest
