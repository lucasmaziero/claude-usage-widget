[project]
name = "claude-usage-widget"
version = "1.0.0"
description = "Floating desktop widget showing Claude Code rate-limit usage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas Maziero" }]
keywords = ["claude", "claude-code", "rate-limit", "widget", "tray", "desktop"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "pyside6-essentials>=6.7",
]

[project.scripts]
claude-usage = "claude_usage.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Qt's C++ API names are camelCase; overriding them is not a style choice.
"src/claude_usage/widget.py" = ["N802"]
"src/claude_usage/panel.py" = ["N802"]
